[project]
name = "ripple"
version = "0.1.0"
description = "Probabilistic graph model of delay propagation and connection risk in the LOT Polish Airlines network"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "metar>=1.11",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "torch>=2.4",
    "torch-geometric>=2.6",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "anthropic>=2.3.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "seaborn>=0.13",
    "scipy>=1.18.1",
]

[project.scripts]
ripple = "ripple.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ripple"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
